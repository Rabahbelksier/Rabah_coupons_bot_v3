<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>الانتقال إلى بوت تلجرام</title>
</head>
<body>
  <script>
    window.setTimeout(function () {
      {% if visit_token %}
      var redirected = false;
      function goToTelegram() {
        if (redirected) return;
        redirected = true;
        window.location.replace({{ target | tojson }});
      }
      // Capture cookies created by Pixel, but never let enrichment block
      // opening Telegram. The server already captured the initial request.
      window.setTimeout(goToTelegram, 250);
      try {
        var data = {token: {{ visit_token | tojson }}};
        document.cookie.split(';').forEach(function (item) {
          var parts = item.trim().split('=');
          if (parts[0] === '_fbp') data.fbp = parts.slice(1).join('=');
          if (parts[0] === '_fbc') data.fbc = parts.slice(1).join('=');
        });
        fetch('/bot/visit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          keepalive: true,
          body: JSON.stringify(data)
        }).then(goToTelegram, goToTelegram);
      } catch (error) {
        goToTelegram();
      }
      {% else %}
      window.location.replace({{ target | tojson }});
      {% endif %}
    }, 800);

    {% if pixel %}
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', {{ pixel | tojson }});
    fbq('track', 'PageView');
    fbq('trackCustom', 'TelegramClick');
    {% endif %}
  </script>
  <noscript><a href="{{ target }}">فتح بوت تلجرام</a></noscript>
</body>
</html>
